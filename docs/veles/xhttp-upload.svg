<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
  <title id="t">Отправка по XHTTP packet-up</title>
  <desc id="d">Тестовый сервер с ответом через 150 мс, запросы по 64 КБ, интервал 30 мс. Без улучшений 3,4 Мбит/с, Veles 13,2 Мбит/с.</desc>
  <style>
    :root { --bg:#f6f3ea; --line:#ddd6c3; --ink:#23291f; --muted:#5d6455; --accent:#a85f00; --base:#767c6c; }
    @media (prefers-color-scheme: dark) { :root { --bg:#161a14; --line:#30372b; --ink:#f0ece0; --muted:#a3aa98; --accent:#e09a33; --base:#7c8374; } }
    text { font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: var(--ink); }
    .h { font-size: 28px; font-weight: 700; }
    .row { font-size: 18px; }
    .sub { font-size: 15px; fill: var(--muted); }
    .val { font-size: 22px; font-weight: 700; }
    .note { font-size: 15px; fill: var(--muted); }
  </style>
  <rect x="1" y="1" width="1198" height="318" rx="16" fill="var(--bg)" stroke="var(--line)" stroke-width="2"/>
  <text class="h" x="40" y="54">XHTTP: скорость отправки при пинге 150 мс, Мбит/с</text>
  <line x1="290" y1="84" x2="290" y2="214" stroke="var(--line)" stroke-width="2"/>

  <text class="row" x="40" y="112">Без улучшений</text>
  <text class="sub" x="40" y="134">интервал 30 мс, замер до правки</text>
  <path d="M290 102 h132 a4 4 0 0 1 4 4 v12 a4 4 0 0 1 -4 4 h-132 z" fill="var(--base)"/>
  <text class="val" x="442" y="120">3,4</text>

  <text class="row" x="40" y="182">Veles</text>
  <text class="sub" x="40" y="204">интервал 30 мс, как по умолчанию</text>
  <path d="M290 172 h524 a4 4 0 0 1 4 4 v12 a4 4 0 0 1 -4 4 h-524 z" fill="var(--accent)"/>
  <text class="val" x="834" y="190">13,2</text>

  <text class="note" x="40" y="252">Тестовый сервер: ответ через 150 мс, запросы по 64 КБ, режим packet-up. Реальная сеть даст другие цифры.</text>
  <text class="note" x="40" y="278">С настоящим Xray при том же пинге, POST через HTTP/2: на 26.3.27 с 2,3 до 12,3 Мбит/с, на 26.9.9 с 2,1–3,2 до 9,1–10,6 Мбит/с.</text>
  <text class="note" x="40" y="302">Приём данных это не меняет.</text>
</svg>
